<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<!-- one-page-dashboard 틀. 외부 라이브러리 없음. {{ }} 자리를 대시보드_숫자.json 값으로 채운다.
     위에서 아래로: 결정 한 줄 → KPI 셋 → 추세와 기준선 → 비교 → 다음 기준과 출처
     강조색(--accent)은 말하려는 곳 한 군데에만. 막대 너비 = 값 / 축 최댓값 (0에서 시작) -->
<style>
  :root { --ink:#2B2A47; --slate:#6B6A85; --line:#E4E4EC; --panel:#F6F6F9; --accent:#F04E23; --base:#C9CAD6; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width:1520px; margin:0 auto; padding:32px 40px; }
  .decision { background:var(--ink); color:#fff; border-radius:12px; padding:18px 24px; display:flex; gap:16px; align-items:baseline; }
  .decision b { color:var(--accent); font-size:14px; letter-spacing:.04em; }
  .decision span { font-size:22px; font-weight:700; }
  .meta { color:var(--slate); font-size:13px; margin:10px 2px 22px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .kpi { background:var(--panel); border-radius:12px; padding:18px 22px; }
  .kpi .name { font-size:14px; color:var(--slate); }
  .kpi .val { font-size:44px; font-weight:800; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
  .kpi .val.on { color:var(--accent); }
  .kpi .base { font-size:14px; color:var(--slate); }
  .row { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin-top:16px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:18px 22px; }
  .card h2 { font-size:17px; margin:0 0 14px; }
  .bars .b { display:grid; grid-template-columns:150px 1fr 64px; align-items:center; gap:10px; margin:8px 0; font-size:14px; }
  .bars .track { background:var(--panel); border-radius:6px; height:22px; }
  .bars .fill { background:var(--base); border-radius:6px; height:22px; }
  .bars .fill.on { background:var(--accent); }
  .bars .n { font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  .next { margin-top:16px; display:flex; justify-content:space-between; gap:16px; font-size:14px; color:var(--slate); }
  .next b { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="decision"><b>결정</b><span>{{결정 한 줄}}</span></div>
  <div class="meta">{{여는 사람}} · {{주기}} · 기간 {{기간}}</div>

  <div class="kpis">
    <div class="kpi"><div class="name">{{KPI 1 이름}}</div><div class="val on">{{값}}</div><div class="base">{{기준선}}</div></div>
    <div class="kpi"><div class="name">{{KPI 2 이름}}</div><div class="val">{{값}}</div><div class="base">{{기준선}}</div></div>
    <div class="kpi"><div class="name">{{KPI 3 이름}}</div><div class="val">{{값}}</div><div class="base">{{기준선}}</div></div>
  </div>

  <div class="row">
    <div class="card"><h2>{{추세 제목 = 결론 문장}}</h2>
      <div class="bars">
        <!-- 기간마다 한 줄. 강조할 줄만 fill on -->
        <div class="b"><span>{{기간 1}}</span><div class="track"><div class="fill" style="width:{{값/최댓값*100}}%"></div></div><span class="n">{{값}}</span></div>
      </div>
    </div>
    <div class="card"><h2>{{비교 제목 = 결론 문장}}</h2>
      <div class="bars">
        <div class="b"><span>{{집단 1}}</span><div class="track"><div class="fill on" style="width:{{}}%"></div></div><span class="n">{{값}}</span></div>
      </div>
    </div>
  </div>

  <div class="next"><span><b>다음 기준</b> {{어디까지 오면 무엇을 하나}}</span><span><b>출처</b> {{파일, 기간, 계산 기준}}</span></div>
</div>
</body>
</html>
